# the upstream component nginx needs to connect to
upstream django {
  server unix:///tmp/subtenancy.sock;
    # server 127.0.0.1:8001; # for a web port socket (we'll use this first)
}

server {
    listen      443 ssl default_server;
    server_name 127.0.0.1 0.0.0.1 localhost ferienmiete.straussi3.de str3.ext.selfnet.de;

    ssl_certificate     /vagrant_data/certificate.pem;
    ssl_certificate_key /vagrant_data/key.pem;
    ssl_ciphers         EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH;
    ssl_protocols       TLSv1.1 TLSv1.2;

    location /static {
        alias /vagrant_data/static; # your Django project's static files - amend as required
    }

    location / {
        uwsgi_pass  django;
        include     /vagrant_data/uwsgi_params;
    }
}
