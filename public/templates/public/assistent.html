<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="../../static/public/style.css">
</head>
<body>

<header style="text-align: center; padding-top: 1rem">

    <a href="/"><img src="../../static/public/logo.svg" style="width: 60px; padding-top: 1rem; padding-bottom: 1rem"></a>
    <h4>Straußäcker 3</h4>
    <h5 class="text-muted">Ferienmiete</h5>

    <ul class="nav justify-content-center bg-primary" style="margin-top: 1.5rem; margin-bottom: 1rem">
        <li class="nav-item">
            <a class="btn btn-primary" href="/hauptmieter">Ferienmiete</a>
        </li>
        <li class="nav-item">
            <a class="btn btn-primary" href="/hauptmieter">Assistent</a>
        </li>
        <li class="nav-item">
            <a class="btn btn-primary" href="/hauptmieter">Hauptmieter</a>
        </li>
        <li class="nav-item">
            <a class="btn btn-primary" href="/untermieter">Untermieter</a>
        </li>
        <li class="nav-item">
            <a class="btn btn-primary" href="/hauptmieter">Verträge</a>
        </li>
        <li class="nav-item">
            <a class="btn btn-primary" href="/hauptmieter">Aktive Ferienmiete</a>
        </li>
        <li class="nav-item">
            <a class="btn btn-primary" href="/impressum">Logout</a>
        </li>
    </ul>

</header>

<div class="container-fluid" style="max-width: 600px; margin-bottom: 10rem">

    <form>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Hauptmieter Registrierung</h5>
            </div>
        </div>
        <div class="card">
            <div class="card-body">


                <h6 class="card-subtitle mb-2 text-muted">Informationen über den Hauptmieter</h6>


                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="batman@secretcave.com">
                </div>

                <div class="form-group">
                    <label for="telefonnummer">Telefonnummer</label>
                    <input type="text" class="form-control" id="telefonnummer" placeholder="+49 0123 4567890">
                </div>

            </div>
        </div>


    </form>


    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
            integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
            crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
            integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
            crossorigin="anonymous"></script>

</html>
