{% extends "subtenancy/base.html" %}

{% load custom_extras %}

{% block content %}

    <form action="{% url 'tenants:TenantUpdate' tenant.id %}" method="post" novalidate>

        {% csrf_token %}

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ title }}</h5>

                {% bootstrap tenant_form get %}

                <button class="btn btn-success btn-block">Aktualisieren</button>
                <a href="{% url 'tenants:TenantView' tenant.id %}"
                   class="btn btn-danger btn-block">Abbrechen</a>

            </div>

        </div>

    </form>

{% endblock %}
