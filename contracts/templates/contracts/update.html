{% extends "subtenancy/base.html" %}

{% load static %}
{% load custom_extras %}

{% block content %}

    <form action="{% url 'contracts:ContractUpdate' form.instance.id %}" method="post" id="updateForm" name="main" novalidate>

        {% csrf_token %}

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ view.title }}{{ title }}
                </h5>

               <div style="margin-bottom: 1rem">
                    <a href="" class="btn btn-primary btn-block" id="view_maintenant" target="_blank"><i class="fas fa-user icon-text"></i>Hauptmieter anzeigen</a>
                    <a href="" class="btn btn-primary btn-block" id="view_subtenant" target="_blank"><i class="fas fa-user icon-text"></i>Untermieter anzeigen</a>
                </div>

                {% bootstrap form get %}

                <script src="{% static 'contracts/view_tenant.js' %}"></script>

                <button class="btn btn-success btn-block">
                   <i class="fas fa-wrench icon-text"></i>Änderungen vornehmen
                </button>
                <a href="{% url 'contracts:ContractView' form.instance.id %}"
                   class="btn btn-danger btn-block"><i class="fas fa-ban icon-text"></i>Abbrechen</a>


            </div>

        </div>

    </form>

{% endblock %}
