version: "3"

services:
  subtenancy:
      image: python:3.5
      command: bash -c /app/docker-entrypoint.sh
      restart: always
      volumes:
        - ./:/app
      ports:
        - "8000:8000"

  database:
      image: postgres
      environment:
          POSTGRES_USER: default
          POSTGRES_PASSWORD: default
          POSTGRES_DB: subtenancy
