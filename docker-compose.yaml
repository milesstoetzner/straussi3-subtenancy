services:
  # TODO: add proxy
  # TODO: add static files server (but pdfs are served by subtenancy?)

  subtenancy:
    build: .
    restart: unless-stopped
    environment:
      SUBTENANCY_SECRET_KEY: SECRET
      SUBTENANCY_ALLOWED_HOSTS: localhost
      SUBTENANCY_ORIGIN: http://localhost

      SUBTENANCY_DB_HOST: database

      SUBTENANCY_DEBUG: 1
    volumes:
      - /etc/subtenancy/contracts:/app/contracts/contracts
    ports:
      - "8000:8000"

  database:
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: default
      POSTGRES_PASSWORD: default
      POSTGRES_DB: subtenancy
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer:5
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  database:
