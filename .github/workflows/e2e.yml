name: End-to-end tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: default
          POSTGRES_PASSWORD: default
          POSTGRES_DB: subtenancy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U default -d subtenancy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUBTENANCY_DB_HOST: 127.0.0.1
      SUBTENANCY_DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y gettext libpq-dev
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: python manage.py compilemessages
        env:
          DJANGO_SETTINGS_MODULE: subtenancy.settings_test
      - run: pytest -v
