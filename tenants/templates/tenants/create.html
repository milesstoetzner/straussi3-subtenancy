{% extends "subtenancy/base.html" %}

{% load custom_extras %}
{% load i18n %}

{% block content %}

    <form action="{% if is_maintenant %}{% url 'MainTenantCreate' %}{% else %}{% url 'SubTenantCreate' %}{% endif %}"
          method="post" novalidate>

        {% csrf_token %}

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ title }}</h5>

                {% bootstrap tenant_form get %}

                {% if request_form %}
                    {% bootstrap request_form get %}
                {% endif %}

                <button class="btn btn-success btn-block"><i class="fas fa-user-edit icon-text"></i>{% trans "Registrieren" %}</button>

            </div>

        </div>

    </form>

{% endblock %}
