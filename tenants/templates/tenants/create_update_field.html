{% for field in form %}


    <div class="form-group">
        {{ field.label_tag }}

        {{ field }}

        <div class="invalid-feedback">{{ field.errors.0 }} <i class="far fa-frown"></i></div>
        <div class="valid-feedback">Alles in Ordnung! <i class="far fa-smile"></i></div>

        {% if field.errors %}
            <script>
                document.getElementById('{{ field.id_for_label }}').classList.add('is-invalid');
            </script>
        {% elif not get %}
            <script>
                document.getElementById('{{ field.id_for_label }}').classList.add('is-valid');
            </script>
        {% endif %}

        {% if field.help_text %}
            <small id="{{ field.id_for_label }}_help"
                   class="form-text text-muted">{{ field.help_text }}</small>
        {% endif %}
    </div>


{% endfor %}
