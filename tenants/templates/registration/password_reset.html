{% extends "tenants/base.html" %}

{% load custom_extras %}

{% block content %}

    <form method="POST" novalidate>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Passwort zurücksetzen</h5>
                <p>Passwort vergessen? Einfach die E-Mail-Adresse unten eingeben und den Anweisungen zum Zurücksetzen
                    des Passworts in der E-Mail folgen.</p>
                    {% csrf_token %}
                    {% bootstrap form get %}
                    <button class="btn btn-block btn-success" style="margin-top: 1rem">Passwort zurücksetzen</button>
            </div>
        </div>
    </form>

{% endblock %}
