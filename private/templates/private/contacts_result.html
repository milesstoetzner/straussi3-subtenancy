<div class="table-responsive">
    <table class="table table-striped" style="white-space: nowrap; text-align: center">

        <thead>
        <tr>
            <th class="align-middle">ID</th>
            <th class="align-middle">Aktiv</th>
            <th class="align-middle">Vorname</th>
            <th class="align-middle">Nachname</th>
            <th class="align-middle">Email</th>
            <th class="align-middle">Telefonnummer</th>
        </tr>

        </thead>

        <tbody>

        {% for subtenant in object_list %}

            <tr>
                <td class="align-middle">{{ subtenant.id }}</td>
                <td class="align-middle">{{ subtenant.active }}</td>
                <td class="align-middle">{{ subtenant.first_name }}</td>
                <td class="align-middle">{{ subtenant.last_name }}</td>
                <td class="align-middle">{{ subtenant.email }}</td>
                <td class="align-middle">{{ subtenant.phone_number }}</td>
            </tr>

        {% endfor %}

        </tbody>
    </table>
</div>
