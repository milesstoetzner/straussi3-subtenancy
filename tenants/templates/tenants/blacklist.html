{% extends "subtenancy/base.html" %}

{% block content %}

    <div class="card">
        <div class="card-body">

            <h5 class="card-title">{{ title }}</h5>

            <p class="text-block">In dieser Liste stehen die Namen der Personen, die sich eine zukünftige Zusammenarbeit mit uns verwehrt haben.</p>

                <div class="table">
                    <table class="table table-hover" style="text-align: center; table-layout:fixed;">

                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Grund</th>
                        </tr>

                        </thead>

                        <tbody>

                        {% for blocked in blacklist %}

                            <tr>
                                <td style="white-space: break-word; vertical-align: middle">{{ blocked.name }}</td>
                                <td style="white-space: break-word;">{{ blocked.reason }}</td>
                            </tr>

                        {% endfor %}


                        </tbody>
                    </table>
                </div>


    </div>

{% endblock %}
