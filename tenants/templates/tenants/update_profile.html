{% extends "subtenancy/base.html" %}

{% load custom_extras %}
{% load i18n %}

{% block content %}

    <form action="{% url 'ProfileUpdate' %}" method="post" novalidate>

        {% csrf_token %}

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ title }}</h5>
                <h6 class="card-subtitle mb-2 text-muted">{{ tenant.get_type_display }} </h6>

                {% form_fields tenant_form get %}

                <button class="btn btn-success btn-block"><i class="fas fa-wrench icon-text"></i>{% trans "Aktualisieren" %}</button>
                <a href="{% url 'Profile' %}" class="btn btn-light btn-block"><i class="fas fa-times icon-text"></i>{% trans "Abbrechen" %}</a>

            </div>

        </div>

    </form>

{% endblock %}
