{% extends "tenants/base.html" %}

{% load custom_extras %}

{% block content %}

    <form method="POST" novalidate>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Passwort ändern</h5>
                    {% csrf_token %}
                    {% bootstrap form get %}
                    <button class="btn btn-block btn-success" style="margin-top: 1rem">Passwort ändern</button>
            </div>
        </div>
    </form>

{% endblock %}
