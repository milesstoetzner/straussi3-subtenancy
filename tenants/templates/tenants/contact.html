{% extends "tenants/base.html" %}

{% block content %}


    <div class="card">
        <div class="card-body">
            <h5 class="card-title">{{ title }}</h5>

            <p>Möchstest du folgende Nachricht an die Person mit der ID {{ tenant.pk }} senden?</p>

            <div class="alert bg-light" role="alert">

                {{ msg | safe }}

            </div>

            <form action="{% url 'tenants:TenantContact' tenant.pk %}" method="POST">

                {% csrf_token %}

                <button class="btn btn-success btn-block">Kontaktieren</button>


                {% if user.is_maintenant %}
                    <a href="{% url 'Requests' %}" class="btn btn-danger btn-block">Abbrechen</a>
                {% else %}
                    <a href="{% url 'Offers' %}" class="btn btn-danger btn-block">Abbrechen</a>
                {% endif %}
            </form>

        </div>

    </div>


{% endblock %}
