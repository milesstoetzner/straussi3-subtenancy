{% extends "subtenancy/base.html" %}

{% load static %}
{% load custom_extras %}

{% block content %}

    <form action="" method="post" id="createForm" name="main"
          onsubmit="event.preventDefault(); contractDetails(); document.getElementById('modalButton').click()"
          novalidate>

        {% csrf_token %}

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ title }}</h5>

                <div style="margin-bottom: 1rem">
                    <a href="" class="btn btn-primary btn-block" id="view_maintenant" target="_blank"><i
                            class="fas fa-user icon-text"></i>Hauptmieter anzeigen</a>
                    <a href="" class="btn btn-primary btn-block" id="view_subtenant" target="_blank"><i
                            class="fas fa-user icon-text"></i>Untermieter anzeigen</a>
                </div>

                {% bootstrap form get %}

                <script src="{% static 'contracts/view_tenant.js' %}"></script>

                <!-- Button trigger modal -->
                <button class="btn btn-success btn-block" data-toggle="modal" data-target="#createModal"
                        id="modalButton">
                    {{ title }}
                </button>

                <!-- Modal -->
                <div class="modal fade" id="createModal" tabindex="-1" role="dialog"
                     aria-labelledby="createModalLabel" aria-hidden="true">
                    <div class="modal-dialog" role="document">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="createModalLabel">Vertrag erstellen</h5>
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            <div class="modal-body">
                                Möchtest du wirklich einen Vertrag erstellen?
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-danger float-left" data-dismiss="modal">Abbrechen</button>
                                <button class="btn btn-success float-right"
                                        onclick="document.getElementById('createForm').submit()">{{ title }}</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </form>

{% endblock %}
