{% extends "subtenancy/base.html" %}

{% load custom_extras %}
{% load i18n %}

{% block content %}

    <form method="POST" novalidate>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{% trans "Passwort ändern" %}</h5>
                    {% csrf_token %}
                    {% form_fields form get %}
                    <button class="btn btn-block btn-success" style="margin-top: 1rem"><i class="fas fa-key icon-text"></i>{% trans "Passwort ändern" %}</button>
            </div>
        </div>
    </form>

{% endblock %}
