{% extends "subtenancy/base.html" %}

{% block content %}


    <div class="card">
        <div class="card-body">

            <h5 class="card-title">{{ title }}</h5>

            {% if roster %}

                <div class="table">
                    <table class="table table-hover" style="text-align: center; table-layout:fixed;">

                        <tbody>

                        {% for entry in roster %}

                            <tr>
                                <td style="white-space: break-word; vertical-align: middle">{{ entry.date|date:'d.m.Y' }}</td>
                                <td style="white-space: break-word; vertical-align: middle">{{ entry.assistant.get_full_name }}</td>
                            </tr>
                        {% endfor %}


                        </tbody>
                    </table>

                </div>

            {% endif %}
        
        </div>


{% endblock %}
