{% extends "subtenancy/base.html" %}

{% block content %}

    <div class="card">
        <div class="card-body">

            <h5 class="card-title">{{ title }}</h5>

            <p class="text-block">In dieser Liste stehen einige der legendärsten Anfragen.</p>

                <div class="table">
                    <table class="table table-striped" style="text-align: center; table-layout:fixed;">

                        <tbody>

                        {% for fame in hall %}

                            <tr>
                                <td style="white-space: break-word; vertical-align: middle">{{ fame.message }}</td>
                            </tr>

                        {% endfor %}


                        </tbody>
                    </table>
                </div>


    </div>

{% endblock %}
