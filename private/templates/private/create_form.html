{% extends "public/base.html" %}

{% block content %}

    <form action="" method="post" id="createForm" name="main"
          onsubmit="event.preventDefault(); contractDetails(); document.getElementById('modalButton').click()">

        {% csrf_token %}

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ view.title }}</h5>

                {% include 'public/form-template.html' %}

                <!-- Button trigger modal -->
                <button class="btn btn-success btn-block" data-toggle="modal" data-target="#createModal"
                        id="modalButton">
                    {{ view.title }}
                </button>

                <!-- Modal -->
                <div class="modal fade" id="createModal" tabindex="-1" role="dialog"
                     aria-labelledby="createModalLabel" aria-hidden="true">
                    <div class="modal-dialog" role="document">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="createModalLabel">Vertrag erstellen</h5>
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            <div class="modal-body">
                                Möchtest du wirklich einen Vertrag mit den folgenden Informationen erstellen?

                                <div id="contractDetails"></div>

                                <script>
                                    function contractDetails() {
                                        let details = document.getElementsByClassName('form-group');
                                        let text = '<br>';
                                        console.log(details);
                                        for (let i = 0; i < details.length; i++) {
                                            let id = details[i].getElementsByTagName('label')[0].htmlFor;
                                            let label = details[i].getElementsByTagName('label')[0].innerHTML;
                                            let element = document.getElementById(id);

                                            console.log(element);

                                            let value;
                                            if (element.tagName === 'SELECT') {
                                                value = element.options[element.selectedIndex].value;

                                                if (id === 'id_main_tenant' || id === 'id_sub_tenant') {
                                                    <!-- TODO: query updateView? -->
                                                    let answer = get(id.replace('id_', '').replace('_', '') + '/' + value);
                                                    text += label + '<br>';
                                                    text += '' + answer + '';
                                                    text += '<br>';
                                                } else {
                                                    text += label + ' ' + value + '<br>';
                                                }

                                            } else {
                                                text += label + ' ' + element.value + '<br>';
                                            }

                                        }
                                        document.getElementById('contractDetails').innerHTML = text;
                                    }

                                    function get(url) {
                                        let xmlHttp = new XMLHttpRequest();
                                        xmlHttp.open("GET", url, false);
                                        xmlHttp.send(null);
                                        return xmlHttp.responseText;
                                    }

                                </script>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-danger float-left" data-dismiss="modal">Abbrechen</button>
                                <button class="btn btn-success float-right"
                                        onclick="document.getElementById('createForm').submit()">{{ view.title }}</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </form>

{% endblock %}
