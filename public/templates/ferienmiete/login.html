<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Hauptmieter Registrierung</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header style="text-align: center; padding-top: 1rem">

    <a href="/"><img src="logo.svg" style="width: 60px; padding-top: 1rem; padding-bottom: 1rem"></a>
    <h4>Straußäcker 3</h4>
    <h5 class="text-muted">Ferienmiete</h5>

</header>

<div class="container-fluid" style="max-width: 300px; margin-bottom: 10rem">

    <form>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Login</h5>

                <div class="form-group">
                    <label for="username">Nutzername</label>
                    <input type="text" class="form-control" id="username" placeholder="Nutzername">
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" class="form-control" id="password" placeholder="Passwort">
                </div>

                <button class="btn btn-primary btn-block">Einloggen</button>

            </div>
        </div>

    </form>


    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
            integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
            crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
            integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
            crossorigin="anonymous"></script>

</body>
</html>
