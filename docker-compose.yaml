services:
  subtenancy:
    image: python:3.13.5
    command: bash -c /app/docker-entrypoint.sh
    restart: unless-stopped
    environment:
      SUBTENANCY_SECRET_KEY: SOME_SECRET
      SUBTENANCY_DB_HOST: database
    volumes:
      - ./:/app
    ports:
      - "8000:8000"

  database:
    image: postgres:17.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: default
      POSTGRES_PASSWORD: default
      POSTGRES_DB: subtenancy
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer:5
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  database:
