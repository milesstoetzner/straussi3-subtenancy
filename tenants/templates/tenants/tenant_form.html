{% extends "tenants/base.html" %}

{% block content %}

    <form action="{% url 'MainTenantCreate' %}" method="post">

        {% csrf_token %}

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ view.title }}</h5>

                <!-- {% include 'tenants/create_update_field.html' %} -->
                <h6 class="card-subtitle mb-2 text-muted" style="padding-top: 2rem">Account</h6>

                {{ user_form.as_p }}

                <h6 class="card-subtitle mb-2 text-muted" style="padding-top: 2rem">Hauptmieter</h6>

                {{ maintenant_form.as_p }}

                <button class="btn btn-success btn-block">Registrieren</button>

            </div>

        </div>

    </form>

{% endblock %}
