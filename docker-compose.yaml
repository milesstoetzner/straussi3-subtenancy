services:
  backend:
    image: ghcr.io/milesstoetzner/straussi3-subtenancy:v3
    restart: unless-stopped
    env_file: /etc/subtenancy/config/backend
    volumes:
      - /etc/subtenancy/contracts:/app/contracts/contracts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - database

  database:
    image: postgres:17.5
    restart: unless-stopped
    env_file: /etc/subtenancy/config/database
    volumes:
      - /etc/subtenancy/database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
