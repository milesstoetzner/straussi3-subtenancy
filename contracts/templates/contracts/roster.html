{% extends "subtenancy/base.html" %}

{% block content %}

    {% if roster %}

        <div class="card">
        <div class="card-body">

            <h5 class="card-title">Persönlicher {{ title }}</h5>

            {% for entry in roster %}
                {% if entry.assistant == user %}

                    <div class="alert rounded-container bg-grey text-center">
                        {{ entry }}
                    </div>
                {% endif %}
            {% endfor %}


        </div>

        <div class="card">
        <div class="card-body">

            <h5 class="card-title">Gesamter {{ title }}</h5>

            {% for entry in roster %}

                <div class="alert rounded-container bg-grey text-center">
                    {{ entry }}
                </div>

            {% endfor %}


        </div>

    {% endif %}

{% endblock %}
