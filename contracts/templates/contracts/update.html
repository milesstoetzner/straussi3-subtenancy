{% extends "subtenancy/base.html" %}

{% load static %}
{% load custom_extras %}

{% block content %}

    <form action="{% url 'contracts:ContractUpdate' form.instance.id %}" method="post" id="updateForm" name="main" onsubmit="event.preventDefault(); document.getElementById('modalButton').click()" novalidate>

        {% csrf_token %}

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ view.title }}{{ title }}
                </h5>

                <div style="margin-bottom: 1rem">
                    <a href="" class="btn btn-primary" style="width: 50%" id="view_maintenant" target="_blank"><i class="fas fa-user icon-text"></i>Hauptmieter anzeigen</a>
                    <a href="" class="btn btn-primary" style="width: 49%" id="view_subtenant" target="_blank"><i class="fas fa-user icon-text"></i>Untermieter anzeigen</a>
                </div>

                {% bootstrap form get %}

                <script src="{% static 'contracts/view_tenant.js' %}"></script>

                <!-- Button trigger modal -->
                <button class="btn btn-success btn-block" data-toggle="modal" data-target="#updateModal" onclick="" id="modalButton">
                    Änderungen vornehmen
                </button>

                <!-- Modal -->
                <div class="modal fade" id="updateModal" tabindex="-1" role="dialog"
                     aria-labelledby="updateModalLabel" aria-hidden="true">
                    <div class="modal-dialog" role="document">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="updateModalLabel">Änderungen</h5>
                            </div>
                            <div class="modal-body">
                                Möchtest du die Änderungen wirklich speichern?
                            </div>
                            <div class="modal-footer">
                                    <button class="btn btn-danger float-left" data-dismiss="modal">Abbrechen</button>
                                    <button class="btn btn-success float-right" onclick="document.getElementById('updateForm').submit()">Änderungen vornehmen</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </form>

{% endblock %}
